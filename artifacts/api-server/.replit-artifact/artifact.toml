kind = "api"
previewPath = "/"
title = "Glovo Plus - Smart Delivery"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "pnpm --filter @workspace/api-server run build"]

[services.production.run]
args = ["sh", "-c", "pnpm --filter @workspace/api-server run start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[[services]]
localPort = 5173
name = "Frontend"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/services/frontend && npm run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/services/frontend && npm run build"]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/services/frontend && npm run preview"]
