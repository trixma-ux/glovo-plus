name: Deploy Glovo Plus Web to GitHub Pages

# Deploys the React + Vite frontend in services/frontend (artifacts/ only holds
# the Express API gateway and the Replit mockup-sandbox, neither is a product site).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          # Set the VITE_API_URL repository variable to a public API gateway URL (ending in /api)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npx vite build --base=/glovo-plus/

      - name: Prepare SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./services/frontend/dist
          publish_branch: gh-pages
